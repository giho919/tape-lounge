name: Recover stuck GitHub Pages deployment
on:
  push:
    paths:
      - .github/workflows/recover-stuck-pages.yml
  workflow_dispatch:
permissions:
  pages: write
jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the stale c17e3cb Pages deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const staleSha = "c17e3cb6ecb06fee247c0a7e1f7249587508495f";
            try {
              await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: staleSha,
                },
              );
              core.info("Cancelled stale Pages deployment " + staleSha);
            } catch (error) {
              if (error.status === 404) {
                core.info("Stale Pages deployment is already inactive or absent.");
                return;
              }
              throw error;
            }
