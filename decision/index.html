async function request(host,start,interval='1d',end=END,limit=1000){const u='https://'+host+'/api/v3/klines?symbol=BTCUSDT&interval='+interval+'&startTime='+start+'&endTime='+end+'&limit='+limit;const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function parseKlines(rows,minTime,maxOpen,closeLimit){const out=[];for(const k of rows){const row={t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5],closeTime:+k[6]};if(!Object.values(row).every(Number.isFinite)||row.c<=0||row.l>Math.min(row.o,row.c)||row.h<Math.max(row.o,row.c))throw Error('Invalid candle');if(row.t>=minTime&&row.t<=maxOpen&&row.closeTime<=closeLimit)out.push(row)}out.sort((a,b)=>a.t-b.t);return out.filter((b,i)=>!i||b.t>out[i-1].t)}
async function loadBars(){let all=[],cursor=START;for(let n=0;n<3&&cursor<=END;n++){let part;try{part=await request('data-api.binance.vision',cursor,'1d',END,1000)}catch{part=await request('api.binance.com',cursor,'1d',END,1000)}if(!Array.isArray(part)||!part.length)break;all.push(...parseKlines(part,START,END,END));cursor=all.at(-1).t+DAY;if(part.length<1000)break}all=all.filter((b,i)=>!i||b.t>all[i-1].t);if(all.length<1100)throw Error('Incomplete history');bars=all;return all}
const contextCache=new Map();async function loadContextBars(interval,index){const candle=bars[index],end=candle.t+DAY-1,span=(interval==='4h'?7:3)*DAY,start=Math.max(START,end-span+1),key=interval+':'+end;if(contextCache.has(key))return contextCache.get(key);const pending=(async()=>{let raw;try{raw=await request('data-api.binance.vision',start,interval,end,1000)}catch{raw=await request('api.binance.com',start,interval,end,1000)}if(!Array.isArray(raw))throw Error('Invalid candle response');const view=parseKlines(raw,start,end,end);if(view.length<20)throw Error('Incomplete intraday history');return view})();contextCache.set(key,pending);try{const result=await pending;contextCache.set(key,result);return result}catch(e){contextCache.delete(key);throw e}}
const fundingCache=new Map();
function fundingClock(ms){return new Intl.DateTimeFormat(LANG==='ko'?'ko-KR':LANG==='ja'?'ja-JP':LANG==='zh'?'zh-CN':'en-US',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms))}
function fundingText(rate){const n=rate*100;return `${n>0?'+':''}${fmt(n,4)}%`}
function loadFunding(cutoff){const key=String(cutoff);if(fundingCache.has(key))return fundingCache.get(key);const start=Math.max(Date.UTC(2019,0,1),cutoff-3*DAY),url=new URL('https://fapi.binance.com/fapi/v1/fundingRate');url.searchParams.set('symbol','BTCUSDT');url.searchParams.set('startTime',String(start));url.searchParams.set('endTime',String(cutoff));url.searchParams.set('limit','1000');const pending=(async()=>{const response=await fetch(url.toString(),{cache:'force-cache'});if(!response.ok)throw Error('Funding HTTP '+response.status);const raw=await response.json();if(!Array.isArray(raw))throw Error('Invalid funding response');const rows=raw.map(x=>({time:Number(x.fundingTime),rate:Number(x.fundingRate)})).filter(x=>Number.isFinite(x.time)&&Number.isFinite(x.rate)&&x.time>=start&&x.time<=cutoff).sort((a,b)=>a.time-b.time);if(!rows.length)return null;const recent=rows.filter(x=>x.time>cutoff-DAY),average=recent.length?recent.reduce((s,x)=>s+x.rate,0)/recent.length:null;return{latest:rows.at(-1),average,count:recent.length}})();const guarded=pending.catch(error=>{fundingCache.delete(key);throw error});fundingCache.set(key,guarded);return guarded}
function renderFunding(index){const bar=bars[index],cutoff=bar.t+DAY-1,key=String(cutoff),summary=$('fundingSummary');summary.textContent=FT.loading;$('fundingLatestValue').textContent='—';$('fundingAverageValue').textContent='—';$('fundingMeta').textContent='';loadFunding(cutoff).then(data=>{if(!game||String(bars[game.cursor].t+DAY-1)!==key)return;if(!data){summary.textContent=FT.unavailable;$('fundingMeta').textContent=FT.unavailable;return}const side=data.latest.rate>0?FT.longs:data.latest.rate<0?FT.shorts:FT.neutral;summary.textContent=`${fundingText(data.latest.rate)} · ${side}`;$('fundingLatestValue').textContent=`${fundingText(data.latest.rate)} · ${side}`;$('fundingAverageValue').textContent=data.count?`${fundingText(data.average)} · ${FT.sample(data.count)}`:FT.unavailable;$('fundingMeta').textContent=FT.meta(fundingClock(data.latest.time))}).catch(()=>{if(!game||String(bars[game.cursor].t+DAY-1)!==key)return;summary.textContent=FT.error;$('fundingMeta').textContent=FT.error})}
function kstDay(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function startRound(){game=null;$('startBox').classList.add('hidden');$('result').classList.add('hidden');$('play').classList.add('hidden');$('chartWrap').classList.add('hidden');$('status').classList.remove('hidden');$('status').innerHTML='<i class="loading"></i>'+T.loading;$('startBtn').disabled=true;loadBars().then(()=>{const span=bars.length-(LOOKBACK+STEPS*STEP_DAYS)-2;const from=hash(seed)%Math.max(1,span);game={origin:from,cursor:from+LOOKBACK,end:from+LOOKBACK+STEPS*STEP_DAYS,step:0,cash:10000,units:0,entry:0,fees:0,trades:0,exposureBars:0,peak:10000,mdd:0,log:[],bhStart:0};game.bhStart=bars[game.cursor].c;game.peak=10000;$('status').classList.add('hidden');$('chartWrap').classList.remove('hidden');$('play').classList.remove('hidden');buildReasons();render()}).catch(()=>{$('play').classList.add('hidden');$('chartWrap').classList.add('hidden');$('status').classList.remove('hidden');$('status').textContent=T.loadError;$('startBox').classList.remove('hidden');$('startBtn').disabled=false})}
function eq(at=game.cursor){return game.cash+game.units*bars[at].c}
function indicators(i){const close=bars[i].c, sma20=bars.slice(i-19,i+1).reduce((s,b)=>s+b.c,0)/20, r5=close/bars[i-5].c-1, slice=bars.slice(i-19,i+1), hi=Math.max(...slice.map(b=>b.h)),lo=Math.min(...slice.map(b=>b.l));return{close,sma20,r5,range:hi/lo-1}}
function resizeCanvas(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function setChartStatus(text,visible){const el=$('chartStatus');el.textContent=text;el.classList.toggle('hidden',!visible)}
function drawCandles(view){const w=canvas.clientWidth,h=canvas.clientHeight;if(view.length<2)return;const pad={l:8,r:8,t:12,b:20},ww=w-pad.l-pad.r,hh=h-pad.t-pad.b,lo=Math.min(...view.map(b=>b.l)),hi=Math.max(...view.map(b=>b.h)),range=hi-lo||1,y=p=>pad.t+(hi-p)/range*hh,x=i=>pad.l+i/(view.length-1)*ww;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#202632';ctx.lineWidth=1;for(let j=0;j<4;j++){const yy=pad.t+j*hh/3;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke()}const bw=Math.max(2,Math.min(7,ww/view.length*.52));view.forEach((b,i)=>{const xx=x(i),up=b.c>=b.o;ctx.strokeStyle=up?'#43d58a':'#fa727d';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(xx,y(b.h));ctx.lineTo(xx,y(b.l));ctx.stroke();const top=y(Math.max(b.o,b.c)),bot=y(Math.min(b.o,b.c));ctx.fillRect(xx-bw/2,top,bw,Math.max(1,bot-top))});ctx.beginPath();ctx.strokeStyle='#d6b454';ctx.lineWidth=1.5;let drawing=false;view.forEach((b,j)=>{if(j<19){drawing=false;return}const avg=view.slice(j-19,j+1).reduce((sum,k)=>sum+k.c,0)/20;if(!drawing){ctx.moveTo(x(j),y(avg));drawing=true}else ctx.lineTo(x(j),y(avg))});ctx.stroke();const last=view.at(-1);ctx.strokeStyle='#a88a40';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,y(last.c));ctx.lineTo(w-pad.r,y(last.c));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#9298a4';ctx.font='10px monospace';ctx.fillText(fmt(hi,0),pad.l+3,pad.t+10);ctx.fillText(fmt(lo,0),pad.l+3,h-7)}
function draw(){if(!game)return;resizeCanvas();if(chartInterval==='1d'){setChartStatus('',false);drawCandles(bars.slice(Math.max(game.origin,game.cursor-75),game.cursor+1));return}const at=game.cursor,interval=chartInterval;setChartStatus(T.chartLoading,true);ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);loadContextBars(interval,at).then(view=>{if(!game||game.cursor!==at||chartInterval!==interval)return;setChartStatus('',false);drawCandles(view)}).catch(()=>{if(!game||game.cursor!==at||chartInterval!==interval)return;setChartStatus(T.chartError,true)})}
function buildReasons(){const box=$('reasons');box.innerHTML='';T.reasons.forEach((label,i)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=label;b.setAttribute('aria-pressed',i===rationale?'true':'false');b.onclick=()=>{rationale=i;buildReasons()};box.appendChild(b)})}
function render(){if(!game)return;const i=game.cursor,ind=indicators(i),equity=eq();$('equity').textContent='$'+fmt(equity,0);$('exposure').textContent=fmt(game.units*ind.close/equity*100,0)+'%';$('drawdown').textContent=pct(-game.mdd*100);$('progress').textContent=`${game.step}/${STEPS}`;$('chartDate').textContent=T.practice;$('lastPrice').textContent='$'+fmt(ind.close,2);$('decisionCount').textContent=T.roundOf(game.step+1);$('question').textContent=game.units?T.holdQ:T.flatQ;$('narrative').textContent=ind.r5>.06?T.narrativeUp:ind.r5<-.06?T.narrativeDown:T.narrativeBase;const dist=ind.close/ind.sma20-1;const facts=[[T.sma,`${pct(dist*100)} ${dist>=0?T.above:T.below}`],[T.ret5,pct(ind.r5*100)],[T.vol20,fmt(ind.range*100,1)+'%']];$('facts').innerHTML=facts.map(([a,b])=>`<span class="fact">${a} · ${b}</span>`).join('');const actions=$('actions');actions.innerHTML='';const add=(label,primary,fn)=>{const b=document.createElement('button');b.className='action'+(primary?' primary':'');b.textContent=label;b.onclick=fn;actions.appendChild(b)};if(game.units){add(T.hold,false,()=>choose('hold'));add(T.exit,true,()=>choose('exit'))}else{add(T.wait,false,()=>choose('wait'));add(T.longQ,true,()=>choose('enter'))}draw()}
const renderWithoutFunding=render;render=function(){renderWithoutFunding();if(game)renderFunding(game.cursor)};
function mark(at){const e=eq(at);game.peak=Math.max(game.peak,e);game.mdd=Math.max(game.mdd,1-e/game.peak)}
function choose(action){if(!game)return;const before=game.cursor,oldPrice=bars[before].c,oldEq=eq(),feeBefore=game.fees;if(action==='enter'&&!game.units){const gross=oldEq*ALLOC,fee=gross*FEE;game.cash-=gross+fee;game.units=gross/oldPrice;game.entry=oldPrice;game.fees+=fee}else if(action==='exit'&&game.units){const gross=game.units*oldPrice,fee=gross*FEE;game.cash+=gross-fee;game.units=0;game.entry=0;game.fees+=fee;game.trades++}const next=Math.min(game.end,before+STEP_DAYS);for(let j=before+1;j<=next;j++){if(game.units)game.exposureBars++;mark(j)}game.cursor=next;game.step++;const newPrice=bars[next].c,pctMove=(newPrice/oldPrice-1)*100;const actionLabel=action==='wait'?T.flatAction:action==='enter'?T.longAction:action==='exit'?T.exitAction:T.holdAction;game.log.push({date:bars[before].t,action:actionLabel,reason:T.reasons[rationale],move:pctMove,fee:game.fees-feeBefore,equityBefore:oldEq,equityAfter:eq()});rationale=0;buildReasons();$('reveal').className='message '+(pctMove>=0?'good':'bad');$('reveal').textContent=T.revealed(pct(pctMove),actionLabel);if(game.step>=STEPS||game.cursor>=game.end){finish();return}render();$('reveal').scrollIntoView({block:'nearest',behavior:'smooth'})}
let shareStats=null;
function finish(){const px=bars[game.cursor].c;if(game.units){const gross=game.units*px,fee=gross*FEE;game.cash+=gross-fee;game.fees+=fee;game.units=0;game.trades++}const final=game.cash;mark(game.cursor);const roi=(final/10000-1)*100,bh=(px/game.bhStart*(1-FEE)*(1-FEE)-1)*100,mdd=-game.mdd*100,exposure=game.exposureBars/(game.cursor-(game.origin+LOOKBACK))*100;shareStats={roi,bh,mdd};$('shareBtn').textContent=SHARE_LABELS[LANG]||T.share;const startDate=utcDate(bars[game.origin+LOOKBACK].t),endDate=utcDate(bars[game.cursor].t);$('play').classList.add('hidden');$('result').classList.remove('hidden');$('shareBtn').classList.remove('hidden');$('result').innerHTML=`<h2>${T.resultTitle}</h2><div class="scoregrid"><div class="score"><span>${T.roi}</span><b style="color:${roi>=0?'var(--green)':'var(--red)'}">${pct(roi)}</b></div><div class="score"><span>${T.bh}</span><b>${pct(bh)}</b></div><div class="score"><span>${T.mdd}</span><b>${pct(-game.mdd*100)}</b></div><div class="score"><span>${T.timeIn}</span><b>${fmt(exposure,0)}%</b></div><div class="score"><span>${T.trades}</span><b>${game.trades}</b></div><div class="score"><span>${T.fee}</span><b>$${fmt(game.fees,2)}</b></div></div><p class="message">${T.period}: ${startDate} – ${endDate}<br>${T.finishNote}</p><details class="ledger"><summary>${T.review}</summary><ol>${game.log.map(x=>`<li>${utcDate(x.date)} · ${x.action} (${x.reason}) · ${pct(x.move)} · ${T.fee} $${fmt(x.fee,2)}</li>`).join('')}</ol></details><button class="secondary" id="againBtn">${T.again}</button>`;$('againBtn').onclick=newRound;$('progress').textContent=`${STEPS}/${STEPS}`;$('equity').textContent='$'+fmt(final,0);$('exposure').textContent=fmt(exposure,0)+'%';$('drawdown').textContent=pct(-game.mdd*100);draw();$('result').scrollIntoView({block:'nearest',behavior:'smooth'})}
function newRound(){shareStats=null;seed=`${kstDay()}-${Math.random().toString(36).slice(2,7)}`;const u=new URL(location.href);u.searchParams.set('round',seed);history.replaceState({},'',u);$('result').classList.add('hidden');$('startBox').classList.remove('hidden');$('chartWrap').classList.add('hidden');$('play').classList.add('hidden');$('status').classList.add('hidden');$('shareBtn').classList.add('hidden');$('shareStatus').textContent='';$('shareStatus').classList.add('hidden');$('shareFallback').value='';$('shareFallback').classList.add('hidden');$('startBtn').disabled=false;$('progress').textContent='—';$('equity').textContent='$10,000';$('exposure').textContent='0%';$('drawdown').textContent='0.00%';ctx.clearRect(0,0,canvas.width,canvas.height)}
function shareResultText(){
if(!shareStats)return T.shareText;
const r=pct(shareStats.roi),b=pct(shareStats.bh),d=pct(shareStats.mdd);
const copy={ko:'과거 BTC 한 구간 가상 연습: 모의 수익률 '+r+' · 같은 구간 보유 '+b+' · 최대 낙폭 '+d+'. 실전 성과는 아닙니다. 같은 판에서 선택을 비교해봐요:',en:'Paper practice on one historical BTC window: simulated return '+r+' · buy-and-hold '+b+' · max drawdown '+d+'. Not live performance. Play the same round and compare:',zh:'历史BTC区间模拟练习：模拟收益 '+r+' · 同期持有 '+b+' · 最大回撤 '+d+'。这不是实盘表现。来玩同一局比较选择：',ja:'過去のBTC区間での模擬練習：模擬リターン '+r+' · 同期間保有 '+b+' · 最大ドローダウン '+d+'。実運用の成績ではありません。同じラウンドで選択を比べてみて：'};
return copy[LANG]||copy.ko;
}
function showShareStatus(message){const status=$('shareStatus');status.textContent=message;status.classList.remove('hidden')}
async function share(){
const u=new URL(location.pathname,'https://tapelounge.com');u.searchParams.set('round',seed);u.searchParams.set('utm_source','share');u.searchParams.set('utm_medium','referral');u.searchParams.set('utm_campaign','decision_game');const text=shareResultText(),invitation=text+'\n'+u.href,status=$('shareStatus'),fallback=$('shareFallback');status.textContent='';status.classList.add('hidden');fallback.value='';fallback.classList.add('hidden');fallback.setAttribute('aria-label',T.shareTextLabel);
if(typeof navigator.share==='function'){showShareStatus(T.shareOpening);try{await navigator.share({title:T.title,text,url:u.href});showShareStatus(T.shareOpened);return}catch(error){if(error&&error.name==='AbortError'){showShareStatus(T.shareCancelled);return}}}
showShareStatus(T.shareCopying);
try{if(!navigator.clipboard||typeof navigator.clipboard.writeText!=='function')throw new Error('clipboard unavailable');let timer;try{await Promise.race([navigator.clipboard.writeText(invitation),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('clipboard timeout')),4000)})])}finally{clearTimeout(timer)}showShareStatus(T.shareCopied)}catch{fallback.value=invitation;fallback.classList.remove('hidden');showShareStatus(T.shareManual)}
}
$('chartIntervals').setAttribute('aria-label',T.chartAria);canvas.setAttribute('aria-label',T.chartAria);document.querySelectorAll('[data-interval]').forEach(button=>button.addEventListener('click',()=>{chartInterval=button.dataset.interval;document.querySelectorAll('[data-interval]').forEach(item=>item.setAttribute('aria-pressed',item===button?'true':'false'));draw()}));$('startBtn').addEventListener('click',startRound);$('shareBtn').addEventListener('click',share);window.addEventListener('resize',draw);
})();
</script>
